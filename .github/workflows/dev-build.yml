name: Dev Build

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

permissions:
  contents: write
  packages: write

jobs:
  # Linux build job
  build-linux:
    name: Build on Linux (Dev)
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake git pkg-config \
          libgtk-3-dev libglib2.0-dev libsodium-dev \
          libssl-dev libssh-dev libvncserver-dev \
          libavahi-ui-gtk3-dev libgcrypt20-dev \
          libjson-glib-dev libsecret-1-dev \
          libayatana-appindicator3-dev \
          libvte-2.91-dev \
          libwebkit2gtk-4.0-dev \
          libcurl4-openssl-dev \
          libcups2-dev \
          freerdp2-dev libwinpr2-dev \
          gettext intltool
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DWITH_TRANSLATIONS=ON \
          -DWITH_AVAHI=ON \
          -DWITH_APPINDICATOR=ON \
          -DWITH_VTE=ON \
          -DWITH_WWW=ON \
          -DWITH_FREERDP=ON \
          -DWITH_NEWS=OFF \
          -DWITH_STATS=OFF
    
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(nproc)
    
    - name: Generate dev version
      id: version
      run: |
        # Dev versioning: YYYY-M-BUILD_NUMBER-dev
        YEAR=$(date +%Y)
        MONTH=$(date +%-m)
        BUILD_NUMBER=${{ github.run_number }}
        
        VERSION="${YEAR}-${MONTH}-${BUILD_NUMBER}-dev"
        SHORT_SHA=$(git rev-parse --short HEAD)
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "Generated dev version: $VERSION"
    
    - name: Install to staging
      run: |
        DESTDIR=${{github.workspace}}/staging cmake --install build
    
    - name: Create .deb package
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        ARCH="amd64"
        PKG_NAME="multi-remmina_${VERSION}_${ARCH}"
        
        mkdir -p "${PKG_NAME}/DEBIAN"
        mkdir -p "${PKG_NAME}/usr"
        
        cp -r staging/usr/* "${PKG_NAME}/usr/"
        
        INSTALLED_SIZE=$(du -sk "${PKG_NAME}/usr" | cut -f1)
        
        cat > "${PKG_NAME}/DEBIAN/control" << EOF
        Package: multi-remmina
        Version: ${VERSION}
        Section: net
        Priority: optional
        Architecture: ${ARCH}
        Depends: libgtk-3-0, libglib2.0-0, libsodium23, libssl3, libssh-4, libvncserver1, libavahi-ui-gtk3-0, libgcrypt20, libjson-glib-1.0-0, libsecret-1-0, libayatana-appindicator3-1, libvte-2.91-0, libwebkit2gtk-4.0-37, libcurl4, libcups2, libfreerdp2-2, libwinpr2-2
        Maintainer: Multi-Remmina Project <ultrasardine@gmail.com>
        Description: Multiplatform remote desktop client (DEV BUILD)
         Multi-Remmina is a remote desktop client supporting multiple protocols.
         .
         This is a development build and may be unstable.
        Homepage: https://github.com/ultrasardine/multi-remmina
        Installed-Size: ${INSTALLED_SIZE}
        EOF
        
        cat > "${PKG_NAME}/DEBIAN/postinst" << 'EOF'
        #!/bin/bash
        set -e
        if [ "$1" = "configure" ]; then
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          if command -v update-mime-database >/dev/null 2>&1; then
            update-mime-database /usr/share/mime || true
          fi
        fi
        exit 0
        EOF
        
        chmod 755 "${PKG_NAME}/DEBIAN/postinst"
        
        dpkg-deb --build "${PKG_NAME}"
        
        echo ".deb package created successfully:"
        ls -lh *.deb
    
    - name: Create AppImage
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
        chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
        
        mkdir -p AppDir/usr
        cp -r staging/usr/* AppDir/usr/
        
        export DEPLOY_GTK_VERSION=3
        export LINUXDEPLOY_PLUGIN_GTK_DEPLOY_GLIB_SCHEMAS=1
        
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --plugin gtk \
          --output appimage || echo "AppImage creation had warnings"
        
        if ls *-x86_64.AppImage 1> /dev/null 2>&1; then
          VERSION="${{ steps.version.outputs.version }}"
          for file in *-x86_64.AppImage; do
            mv "$file" "Multi-Remmina-${VERSION}-x86_64.AppImage"
          done
          echo "AppImage created successfully:"
          ls -lh Multi-Remmina*.AppImage
        else
          echo "ERROR: AppImage was not created"
          exit 1
        fi
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: multi-remmina-linux-dev-${{ steps.version.outputs.version }}
        path: |
          Multi-Remmina*.AppImage
          multi-remmina*.deb
        retention-days: 30

  # macOS build job
  build-macos:
    name: Build on macOS (Dev)
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        brew install cmake pkg-config gtk+3 glib libsodium openssl@3 \
                     libssh libvncserver gettext json-glib libgcrypt curl \
                     freerdp || true
    
    - name: Configure CMake
      run: |
        FREERDP_PREFIX=$(brew --prefix freerdp)
        
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DCMAKE_PREFIX_PATH="$(brew --prefix);${FREERDP_PREFIX}" \
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
          -DFreeRDP_DIR="${FREERDP_PREFIX}/lib/cmake/FreeRDP3" \
          -DFreeRDP-Client_DIR="${FREERDP_PREFIX}/lib/cmake/FreeRDP-Client3" \
          -DWinPR_DIR="${FREERDP_PREFIX}/lib/cmake/WinPR3" \
          -DWITH_AVAHI=OFF \
          -DWITH_APPINDICATOR=OFF \
          -DWITH_TELEPATHY=OFF \
          -DWITH_VTE=OFF \
          -DWITH_WWW=OFF \
          -DWITH_FREERDP=ON \
          -DWITH_SPICE=OFF \
          -DWITH_X2GO=OFF \
          -DWITH_PYTHONLIBS=OFF \
          -DWITH_MACOS_KEYCHAIN=ON \
          -DWITH_NEWS=OFF \
          -DWITH_STATS=OFF
    
    - name: Build
      run: |
        cmake --build build --config ${{env.BUILD_TYPE}} -j$(sysctl -n hw.ncpu)
        
        echo "=== Checking what plugins were built ==="
        find build/plugins -name "*.so" -o -name "*.dylib"
        echo "=== Plugin build complete ==="
    
    - name: Generate dev version
      id: version
      run: |
        YEAR=$(date +%Y)
        MONTH=$(date +%-m)
        BUILD_NUMBER=${{ github.run_number }}
        
        VERSION="${YEAR}-${MONTH}-${BUILD_NUMBER}-dev"
        SHORT_SHA=$(git rev-parse --short HEAD)
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "Generated dev version: $VERSION"
    
    - name: Create application bundle
      run: |
        BINARY_PATH=$(find build/src -name "multi-remmina" -type f | head -1)
        
        if [ -z "$BINARY_PATH" ]; then
          BINARY_PATH=$(find build/src -name "remmina" -type f | head -1)
        fi
        
        if [ -z "$BINARY_PATH" ]; then
          echo "Error: multi-remmina binary not found"
          exit 1
        fi
        
        echo "Found binary at: $BINARY_PATH"
        
        mkdir -p Multi-Remmina.app/Contents/{MacOS,Resources,Frameworks,lib}
        
        cp "$BINARY_PATH" Multi-Remmina.app/Contents/MacOS/multi-remmina
        chmod +x Multi-Remmina.app/Contents/MacOS/multi-remmina
        
        mkdir -p Multi-Remmina.app/Contents/Resources/lib/multi-remmina/plugins
        
        echo "Looking for plugin files..."
        find build/plugins -name "*.so" -o -name "*.dylib" || echo "No plugins found"
        
        find build/plugins -type f \( -name "*.so" -o -name "*.dylib" \) | while read plugin; do
          echo "Copying plugin: $plugin"
          cp "$plugin" Multi-Remmina.app/Contents/Resources/lib/multi-remmina/plugins/ || true
        done
        
        echo "Plugins in app bundle:"
        ls -la Multi-Remmina.app/Contents/Resources/lib/multi-remmina/plugins/
        
        cp -r data/ui Multi-Remmina.app/Contents/Resources/ 2>/dev/null || true
        cp -r data/theme Multi-Remmina.app/Contents/Resources/ 2>/dev/null || true
        
        mkdir -p AppIcon.iconset
        cp data/desktop/16x16/apps/org.multi-remmina.MultiRemmina.png AppIcon.iconset/icon_16x16.png
        cp data/desktop/32x32/apps/org.multi-remmina.MultiRemmina.png AppIcon.iconset/icon_16x16@2x.png
        cp data/desktop/32x32/apps/org.multi-remmina.MultiRemmina.png AppIcon.iconset/icon_32x32.png
        cp data/desktop/64x64/apps/org.multi-remmina.MultiRemmina.png AppIcon.iconset/icon_32x32@2x.png
        cp data/desktop/128x128/apps/org.multi-remmina.MultiRemmina.png AppIcon.iconset/icon_128x128.png
        cp data/desktop/256x256/apps/org.multi-remmina.MultiRemmina.png AppIcon.iconset/icon_128x128@2x.png
        cp data/desktop/256x256/apps/org.multi-remmina.MultiRemmina.png AppIcon.iconset/icon_256x256.png
        cp data/desktop/512x512/apps/org.multi-remmina.MultiRemmina.png AppIcon.iconset/icon_256x256@2x.png
        cp data/desktop/512x512/apps/org.multi-remmina.MultiRemmina.png AppIcon.iconset/icon_512x512.png
        
        iconutil -c icns AppIcon.iconset -o Multi-Remmina.app/Contents/Resources/AppIcon.icns
        
        echo "Icon created successfully:"
        ls -lh Multi-Remmina.app/Contents/Resources/AppIcon.icns
        
        brew install dylibbundler
        
        dylibbundler -od -b \
          -x Multi-Remmina.app/Contents/MacOS/multi-remmina \
          -d Multi-Remmina.app/Contents/Frameworks \
          -p @executable_path/../Frameworks \
          || echo "dylibbundler completed with warnings"
        
        for plugin in Multi-Remmina.app/Contents/Resources/lib/multi-remmina/plugins/*.so; do
          if [ -f "$plugin" ]; then
            echo "Bundling dependencies for: $plugin"
            dylibbundler -od -b \
              -x "$plugin" \
              -d Multi-Remmina.app/Contents/Frameworks \
              -p @executable_path/../Frameworks \
              || echo "dylibbundler warning for $plugin"
          fi
        done
        
        xattr -cr Multi-Remmina.app || true
        
        cat > Multi-Remmina.app/Contents/Info.plist << EOFPLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>multi-remmina</string>
            <key>CFBundleIdentifier</key>
            <string>org.multi-remmina.MultiRemmina.dev</string>
            <key>CFBundleName</key>
            <string>Multi-Remmina Dev</string>
            <key>CFBundleDisplayName</key>
            <string>Multi-Remmina Dev</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.version.outputs.version }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOFPLIST
    
    - name: Create ZIP archive
      run: |
        cp scripts/install-macos.sh .
        
        cat > INSTALL.txt << 'EOFINSTALL'
        Multi-Remmina for macOS - DEV BUILD
        ====================================
        
        This is a development build and may be unstable.
        
        QUICK INSTALL:
          1. Extract this ZIP file
          2. Open Terminal in the extracted folder
          3. Run: bash install-macos.sh
        
        MANUAL INSTALL:
          1. Extract this ZIP file
          2. Drag Multi-Remmina.app to /Applications
          3. Open Terminal and run:
             xattr -cr /Applications/Multi-Remmina.app
          4. Launch Multi-Remmina from Applications
        
        Version: ${{ steps.version.outputs.version }}
        Commit: ${{ steps.version.outputs.short_sha }}
        EOFINSTALL
        
        mkdir -p Multi-Remmina-macOS-Dev
        cp -R Multi-Remmina.app Multi-Remmina-macOS-Dev/
        cp install-macos.sh Multi-Remmina-macOS-Dev/
        cp INSTALL.txt Multi-Remmina-macOS-Dev/
        
        zip -r Multi-Remmina-${{ steps.version.outputs.version }}-macOS.zip Multi-Remmina-macOS-Dev
        
        hdiutil create -volname "Multi-Remmina Dev" \
          -srcfolder Multi-Remmina-macOS-Dev \
          -ov -format UDZO \
          Multi-Remmina-${{ steps.version.outputs.version }}-macOS.dmg
    
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: multi-remmina-macos-dev-${{ steps.version.outputs.version }}
        path: |
          Multi-Remmina*.zip
          Multi-Remmina*.dmg
        retention-days: 30
