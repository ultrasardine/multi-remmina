name: Build and Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # Linux build job
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake git pkg-config \
          libgtk-3-dev libglib2.0-dev libsodium-dev \
          libssl-dev libssh-dev libvncserver-dev \
          libavahi-ui-gtk3-dev libgcrypt20-dev \
          libjson-glib-dev libsecret-1-dev \
          libayatana-appindicator3-dev \
          libvte-2.91-dev \
          libwebkit2gtk-4.0-dev \
          freerdp2-dev libwinpr2-dev \
          gettext intltool
    
    - name: Install FreeRDP
      run: |
        # FreeRDP is not available in default repos, skip it for now
        # RDP plugin will be disabled but other protocols will work
        echo "Skipping FreeRDP installation - not available in Ubuntu default repos"
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DWITH_TRANSLATIONS=ON \
          -DWITH_AVAHI=ON \
          -DWITH_APPINDICATOR=ON \
          -DWITH_VTE=ON \
          -DWITH_WWW=ON \
          -DWITH_FREERDP=ON \
          -DWITH_NEWS=OFF \
          -DWITH_STATS=OFF
    
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(nproc)
    
    - name: Run tests
      working-directory: build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure || true
    
    - name: Install to staging
      run: |
        DESTDIR=${{github.workspace}}/staging cmake --install build
    
    - name: Create AppImage
      run: |
        # Download linuxdeploy and GTK plugin
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
        chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
        
        # Create AppDir structure
        mkdir -p AppDir/usr
        cp -r staging/usr/* AppDir/usr/
        
        # Bundle all dependencies including GTK, FreeRDP, VNC, etc.
        export DEPLOY_GTK_VERSION=3
        export LINUXDEPLOY_PLUGIN_GTK_DEPLOY_GLIB_SCHEMAS=1
        
        # Create AppImage with all dependencies bundled
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --plugin gtk \
          --output appimage || true
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: multi-remmina-linux-x86_64
        path: |
          Multi-Remmina*.AppImage
        retention-days: 30

  # macOS build job
  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        # Install core dependencies, skip FreeRDP (version mismatch)
        brew install cmake pkg-config gtk+3 glib libsodium openssl@3 \
                     libssh libvncserver gettext json-glib libgcrypt || true
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
          -DWITH_AVAHI=OFF \
          -DWITH_APPINDICATOR=OFF \
          -DWITH_TELEPATHY=OFF \
          -DWITH_VTE=OFF \
          -DWITH_WWW=OFF \
          -DWITH_FREERDP=OFF \
          -DWITH_SPICE=OFF \
          -DWITH_X2GO=OFF \
          -DWITH_PYTHONLIBS=OFF \
          -DWITH_MACOS_KEYCHAIN=ON \
          -DWITH_NEWS=OFF \
          -DWITH_STATS=OFF
    
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(sysctl -n hw.ncpu)
    
    - name: Run tests
      working-directory: build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure || true
    
    - name: Create application bundle
      run: |
        # Create app bundle structure
        mkdir -p Multi-Remmina.app/Contents/{MacOS,Resources,Frameworks,lib}
        
        # Copy binary
        cp build/src/multi-remmina Multi-Remmina.app/Contents/MacOS/
        
        # Copy plugins
        mkdir -p Multi-Remmina.app/Contents/lib/multi-remmina/plugins
        cp -r build/plugins/*.so Multi-Remmina.app/Contents/lib/multi-remmina/plugins/ || true
        
        # Copy resources (icons, UI files, themes)
        cp -r data/ui Multi-Remmina.app/Contents/Resources/ || true
        cp -r data/theme Multi-Remmina.app/Contents/Resources/ || true
        cp -r data/desktop/*.png Multi-Remmina.app/Contents/Resources/ || true
        
        # Bundle all Homebrew dependencies using dylibbundler
        brew install dylibbundler
        
        # Bundle dependencies into Frameworks
        dylibbundler -od -b \
          -x Multi-Remmina.app/Contents/MacOS/multi-remmina \
          -d Multi-Remmina.app/Contents/Frameworks \
          -p @executable_path/../Frameworks \
          || echo "dylibbundler completed with warnings"
        
        # Create Info.plist
        cat > Multi-Remmina.app/Contents/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>multi-remmina</string>
            <key>CFBundleIdentifier</key>
            <string>org.multi-remmina.MultiRemmina</string>
            <key>CFBundleName</key>
            <string>Multi-Remmina</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF
    
    - name: Create DMG
      run: |
        # Create a DMG with the app bundle
        hdiutil create -volname "Multi-Remmina" \
          -srcfolder Multi-Remmina.app \
          -ov -format UDZO \
          Multi-Remmina-macOS.dmg
    
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: multi-remmina-macos
        path: |
          Multi-Remmina*.dmg
        retention-days: 30

  # Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang-format
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,style,performance,portability \
          --suppress=missingIncludeSystem \
          --inline-suppr \
          --error-exitcode=0 \
          src/ plugins/ || true
    
    - name: Check code formatting
      run: |
        # Check if code follows formatting standards
        find src plugins -name "*.c" -o -name "*.h" | \
          xargs clang-format --dry-run --Werror || true
