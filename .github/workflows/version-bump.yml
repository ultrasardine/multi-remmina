name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      create_release:
        description: 'Create release after bump'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get current version
      id: current
      run: |
        CURRENT_VERSION=$(grep -oP 'VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"
    
    - name: Calculate new version
      id: bump
      run: |
        CURRENT="${{ steps.current.outputs.current_version }}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        
        case "${{ github.event.inputs.bump_type }}" in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch)
            PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"
    
    - name: Update version in CMakeLists.txt
      run: |
        NEW_VERSION="${{ steps.bump.outputs.new_version }}"
        sed -i "s/VERSION [0-9]\+\.[0-9]\+\.[0-9]\+/VERSION $NEW_VERSION/" CMakeLists.txt
        
        # Verify the change
        grep "VERSION $NEW_VERSION" CMakeLists.txt
    
    - name: Update version in package files
      run: |
        NEW_VERSION="${{ steps.bump.outputs.new_version }}"
        
        # Update snap/snapcraft.yaml if exists
        if [ -f snap/snapcraft.yaml ]; then
          sed -i "s/version: '[0-9]\+\.[0-9]\+\.[0-9]\+'/version: '$NEW_VERSION'/" snap/snapcraft.yaml
        fi
        
        # Update flatpak manifest if exists
        if [ -f flatpak/org.multi-remmina.MultiRemmina.json ]; then
          sed -i "s/\"version\": \"[0-9]\+\.[0-9]\+\.[0-9]\+\"/\"version\": \"$NEW_VERSION\"/" \
            flatpak/org.multi-remmina.MultiRemmina.json
        fi
    
    - name: Commit version bump
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add CMakeLists.txt snap/snapcraft.yaml flatpak/*.json || true
        git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
        git push origin HEAD:master
    
    - name: Create and push tag
      run: |
        NEW_VERSION="${{ steps.bump.outputs.new_version }}"
        git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
        git push origin "v${NEW_VERSION}"
    
    - name: Trigger release workflow
      if: ${{ github.event.inputs.create_release == 'true' }}
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'release.yml',
            ref: 'master',
            inputs: {
              version: '${{ steps.bump.outputs.new_version }}'
            }
          });
